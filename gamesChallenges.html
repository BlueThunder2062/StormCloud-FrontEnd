<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Challenges</title>
    <link rel="stylesheet" href="css/styleGamesChallenges.css">
</head>
<body>

<div id="pageWrapper">

    <!-- LEFT SIDEBAR -->
    <aside id="sidebar">
        <input id="gameFilter" type="text" placeholder="Search games...">

        <div id="gamesList">
            <!-- Example game divs
            <div class="gameItem">Tomb Raider</div>
            <div class="gameItem">Sonic Adventure DX</div>
            <div class="gameItem">Kirby’s Adventure</div>-->
        </div>

        <a href="home.html" id="backHome">← Back to Storm Cloud Home</a>

    </aside>

    <!-- MAIN CONTENT -->
    <main id="mainContent">

        <h1 id="selectedGameName">Select a Game</h1>

        <div id="challengeWrapper">

            <!-- QUICK CHALLENGES -->
            <section class="challengeSection">
                <h2>Quick Challenges</h2>
                <button class="addChallengeBtn">Add New Challenge</button>

                <div class="challengeList" id="quickChallenges">
                    <!-- Example divs for challenges
                     <div class="challengeRow">Collect 10 coins</div>
                    <div class="challengeRow">Beat the first level</div>
                    <div class="challengeRow">Find the hidden gem</div>
                    <div class="challengeRow">Finish the stage in under 3 minutes</div>
                    <div class="challengeRow">Defeat the boss without taking damage</div>
                    <div class="challengeRow">Collect all rings</div>
                    <div class="challengeRow">Complete the puzzle room</div>
                    <div class="challengeRow">Reach the goal without jumping</div>-->
                </div>
            </section>

            <!-- LONG CHALLENGES -->
            <section class="challengeSection">
                <h2>Long Challenges</h2>
                <button class="addChallengeBtn">Add New Challenge</button>

                <div class="challengeList" id="longChallenges">
                    <!-- Example divs for challenges
                     <div class="challengeRow">Collect 10 coins</div>
                    <div class="challengeRow">Beat the first level</div>
                    <div class="challengeRow">Find the hidden gem</div>
                    <div class="challengeRow">Finish the stage in under 3 minutes</div>
                    <div class="challengeRow">Defeat the boss without taking damage</div>
                    <div class="challengeRow">Collect all rings</div>
                    <div class="challengeRow">Complete the puzzle room</div>
                    <div class="challengeRow">Reach the goal without jumping</div>-->

                </div>
            </section>

        </div>

    </main>

</div>

</body>
</html>
